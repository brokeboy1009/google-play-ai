
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10131a">
  <title>Google-Play-AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10131a;
      color: #f5f7fb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 18px;
      border-bottom: 1px solid #2a303b;
      font-size: 21px;
      font-weight: bold;
    }
    header span { color: #8b9cff; }
    #chat {
      flex: 1;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px 16px;
    }
    .welcome {
      text-align: center;
      margin: 70px 0 30px;
    }
    .welcome h1 { font-size: 30px; }
    .welcome p { color: #aab2c0; }
    .message {
      padding: 14px 16px;
      margin: 12px 0;
      border-radius: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user { background: #28334b; }
    .assistant { background: #1c222d; }
    #form {
      position: sticky;
      bottom: 0;
      padding: 14px;
      background: #10131a;
      border-top: 1px solid #2a303b;
    }
    .input-row {
      display: flex;
      gap: 10px;
      max-width: 800px;
      margin: auto;
    }
    textarea {
      flex: 1;
      resize: none;
      min-width: 0;
      height: 52px;
      max-height: 140px;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #394253;
      background: #1c222d;
      color: white;
      font: inherit;
    }
    button {
      border: 0;
      border-radius: 12px;
      background: #7185ff;
      color: white;
      padding: 0 20px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }
    .note {
      text-align: center;
      color: #929baa;
      font-size: 12px;
      margin: 10px 0 0;
    }
  </style>
</head>
<body>
  <header>Google-Play-<span>AI</span></header>

  <main id="chat" aria-live="polite">
    <div class="welcome" id="welcome">
      <h1>How can I help you?</h1>
      <p>Ask a question and chat with AI.</p>
    </div>
  </main>

  <form id="form">
    <div class="input-row">
      <textarea id="prompt" placeholder="Message Google-Play-AI..."
        aria-label="Your message" required></textarea>
      <button id="send" type="submit">Send</button>
    </div>
    <p class="note">AI can make mistakes. Check important information.</p>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const promptBox = document.getElementById("prompt");
    const sendButton = document.getElementById("send");
    const history = [];

    function addMessage(role, content) {
      document.getElementById("welcome")?.remove();
      const bubble = document.createElement("div");
      bubble.className = "message " + role;
      bubble.textContent =
        (role === "user" ? "You: " : "Google-Play-AI: ") + content;
      chat.appendChild(bubble);
      bubble.scrollIntoView({ behavior: "smooth", block: "end" });
      return bubble;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = promptBox.value.trim();
      if (!message || sendButton.disabled) return;

      history.push({ role: "user", content: message });
      addMessage("user", message);
      promptBox.value = "";
      sendButton.disabled = true;
      const loading = addMessage("assistant", "Thinking...");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Request failed.");
        }
        if (typeof data.reply !== "string") {
          throw new Error("The server returned an unexpected response.");
        }

        loading.textContent = "Google-Play-AI: " + data.reply;
        history.push({ role: "assistant", content: data.reply });
      } catch (error) {
        loading.textContent = "Google-Play-AI: " + error.message;
        history.pop();
      } finally {
        sendButton.disabled = false;
        promptBox.focus();
      }
    });

    promptBox.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
  </html>
